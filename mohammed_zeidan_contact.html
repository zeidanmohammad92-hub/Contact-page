<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammed Zeidan - Contact</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4f6f8}
.card{width:min(90%,420px);box-sizing:border-box;background:white;padding:32px;border-radius:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.1)}
h1{margin-bottom:8px}.position{color:#555;margin-bottom:24px}.info{text-align:left;line-height:1.8;margin-bottom:24px}
.button{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:12px;text-decoration:none;border:0;font-size:16px;cursor:pointer;background:#111;color:white}
.button.secondary{background:#e9ecef;color:#111}
</style>
</head>
<body>
<main class="card">
<h1>Mohammed Zeidan</h1>
<div class="position">Head Administration</div>
<div class="info">
<div><strong>Phone:</strong> +233 55 146 8687</div>
<div><strong>Email:</strong> zeidanmohammad92@gmail.com</div>
</div>
<a class="button" href="tel:+233551468687">Call +233 55 146 8687</a>
<button class="button secondary" onclick="saveContact()">Save Contact</button>
</main>
<script>
function saveContact(){
const vcard=`BEGIN:VCARD
VERSION:3.0
FN:Mohammed Zeidan
N:Zeidan;Mohammed;;;
TEL;TYPE=CELL:+233551468687
EMAIL:zeidanmohammad92@gmail.com
TITLE:Head Administration
END:VCARD`;
const blob=new Blob([vcard],{type:"text/vcard;charset=utf-8"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url; link.download="Mohammed_Zeidan.vcf";
document.body.appendChild(link); link.click(); link.remove();
URL.revokeObjectURL(url);
}
</script>
</body>
</html>
